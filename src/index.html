<!doctype html>
<html lang="en">
  <head>
    <meta http-equiv="Content-Type" content="text/html;charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="app-icon.png" />
    <meta name="theme-color" content="#F8B0C7" />
    <link rel="manifest" href="manifest.json" />
    <title>Sweet Trails</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <header class="app-header">
      <div class="main-header container">
        <a class="brand-name" href="#/">
          <img
            class="brand-logo"
            src="images/app-icon.png"
            alt="Sweet Trails Logo"
          />
        </a>
        <button
          id="drawer-button"
          class="drawer-button"
          aria-label="Toggle Navigation"
        >
          ☰
        </button>
      </div>
    </header>

    <nav id="main-navbar" class="main-navbar">
      <div class="container">
        <ul id="nav-list" class="nav-list">
          <li><a href="#/">Home Page</a></li>
          <li><a href="#/add">Add Story</a></li>
          <li><a href="#/liked">Likes</a></li>
          <li><a href="#/about">About</a></li>
          <li id="login-menu" class="auth-menu"><a href="#/login">Login</a></li>
          <li id="logout-menu" class="auth-menu" style="display: none">
            <button id="logout-button" class="logout-button">Logout</button>
          </li>
          <li><button id="push-toggle-button" class="logout-button push-toggle-button" aria-label="Toggle Push Notification" style="display: none;">🔔 Subscribe</button></li>
        </ul>
      </div>
    </nav>

    <aside id="navigation-drawer" class="navigation-drawer">
      <div class="drawer-header">Menu</div>
      <ul class="drawer-nav-list">
        <li><a href="#/">Home Page</a></li>
        <li><a href="#/add">Add Story</a></li>
        <li><a href="#/liked">Likes</a></li>
        <li><a href="#/about">About</a></li>
        <li id="drawer-login-menu" class="auth-menu">
          <a href="#/login">Login</a>
        </li>
        <li id="drawer-logout-menu" class="auth-menu" style="display: none">
          <button id="drawer-logout-button" class="logout-button">
            Logout
          </button>
        </li>
        <li><button id="drawer-push-toggle-button" class="logout-button push-toggle-button" aria-label="Toggle Push Notification" style="display: none;">🔔 Subscribe</button></li>
      </ul>
    </aside>

    <main id="main-content" class="main-content" tabindex="-1"></main>

    <footer class="app-footer">
      <div class="container">
        <p>&copy; 2025 Sweet Trails - All rights reserved.</p>
      </div>
    </footer>
  </body>
</html>
